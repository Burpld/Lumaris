name: Lumaris
version: 1.1.1
main: lumaris.Main
api-version: 1.21.11
commands:
  hub:
    description: Teleport to the hub.
  adminhub:
    description: Teleport to the admin hub.
    permission: lumaris.admin
  party:
    description: Main party and queue command.
    aliases: [p]
    usage: /party <new|add|accept/join|queue/q|leavequeue/dq|leave|list|kick|promote>
  spawnnpc:
    description: Spawn the Battle Box mannequin.
    permission: lumaris.admin
  partychat:
    description: Chat with your party.
    aliases: [pc]
  dolphinfun:
    description: Hi.
  spawnbattleitem:
    description: Spawns an item from the battle gamemode.
  friend:
    description: Main friend command.
    aliases: [friends, f]
    usage: /friend <list|add|remove|partyfriend|accept|decline>
    permission: lumaris.friend
  battlebox:
    description: Configure Battle Box arenas.
    permission: lumaris.admin
    usage: /battlebox <setcenter|setspawn|status> <map> [index|team]

permissions:
  lumaris.friend:
    description: Allows players to use the friends command.
    default: true